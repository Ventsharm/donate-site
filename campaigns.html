<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftMe Campaigns</title><style>:root{--bg:#f4f1ff;--text:#171426;--muted:#665f7a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#efe9ff 0,#f7f5ff 42%,#fff 100%);color:var(--text)}.wrap{padding:20px;max-width:680px;margin:0 auto}.hero{background:linear-gradient(135deg,#6d4fe8,#b697ff);color:#fff;padding:34px 22px;border-radius:28px;margin:12px 0 18px;text-align:center;box-shadow:0 18px 45px rgba(118,87,234,.22)}.hero h1{margin:0;font-size:38px;line-height:1;font-weight:950;letter-spacing:-1px}.hero p{margin:10px 0 0;color:rgba(255,255,255,.92);font-weight:700}.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 18px 55px rgba(75,56,160,.14)}.item{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#6d4fe8,#b697ff);border-radius:22px;padding:17px 18px;margin:12px 0;font-weight:950;font-size:18px;box-shadow:0 12px 32px rgba(118,87,234,.22)}.itemTitle{display:block}.itemBy{display:block;margin-top:5px;font-size:14px;font-weight:850;color:rgba(255,255,255,.86);line-height:1.25}.empty{padding:16px;border-radius:20px;background:#f7f4ff;color:var(--muted);font-weight:850;text-align:center}.btn{display:block;text-align:center;text-decoration:none;width:100%;padding:16px;border-radius:22px;border:0;font-size:18px;font-weight:950;margin-top:14px;background:#f1edff;color:#3d2d87}#campaignLoader{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#faf8ff,#f2edff,#ebe4ff);transition:opacity .4s ease,visibility .4s ease}#campaignLoader.hide{opacity:0;visibility:hidden;pointer-events:none}.loaderCard{width:min(88vw,360px);padding:34px 28px;text-align:center;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 20px 60px rgba(74,50,130,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.loaderOrbWrap{position:relative;width:88px;height:88px;margin:0 auto 20px}.loaderGlow{position:absolute;inset:9px;border-radius:50%;background:rgba(125,91,213,.22);filter:blur(16px);animation:giftPulse 1.5s ease-in-out infinite}.loaderOrb{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#7657ea,#b994ff,#e4d8ff,#7657ea);animation:giftSpin 1s linear infinite;box-shadow:0 12px 32px rgba(118,87,234,.28)}.loaderOrb:before{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(255,255,255,.96)}.loaderOrb:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#7657ea;font-size:27px;font-weight:900;animation:giftCounterSpin 1s linear infinite}.loaderTitle{font-size:21px;font-weight:950;color:#352a50}.loaderSub{margin-top:7px;font-size:14px;line-height:1.5;color:#7b7289;font-weight:700}.loaderDots{display:flex;justify-content:center;gap:6px;margin-top:18px}.loaderDots i{width:6px;height:6px;border-radius:50%;background:#9276dd;animation:giftDot 1.2s ease-in-out infinite}.loaderDots i:nth-child(2){animation-delay:.15s}.loaderDots i:nth-child(3){animation-delay:.3s}@keyframes giftSpin{to{transform:rotate(360deg)}}@keyframes giftCounterSpin{to{transform:rotate(-360deg)}}@keyframes giftPulse{50%{transform:scale(1.15);opacity:1}}@keyframes giftDot{30%{transform:translateY(-5px);opacity:1}}</style></head><body><div id="campaignLoader"><div class="loaderCard"><div class="loaderOrbWrap"><div class="loaderGlow"></div><div class="loaderOrb"></div></div><div class="loaderTitle">Loading GiftMe campaigns</div><div class="loaderSub">Finding live campaigns for you…</div><div class="loaderDots"><i></i><i></i><i></i></div></div></div><div class="wrap"><div class="hero"><h1>Campaigns ✓</h1><p>All public campaign links</p></div><div class="card"><div id="list"><div class="empty">Loading campaigns…</div></div><a class="btn" href="./">Back</a></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyBMZo5HOStyDEINl2xLm-M9X4PaDc-raBQ",authDomain:"donate-app-ff07c.firebaseapp.com",projectId:"donate-app-ff07c",storageBucket:"donate-app-ff07c.firebasestorage.app",messagingSenderId:"950201336557",appId:"1:950201336557:web:e8bdfa02d99512051f82e4"});const db=getFirestore(app),list=document.getElementById("list"),loader=document.getElementById("campaignLoader"),base=location.origin+"/donate-site/",CACHE_KEY="giftmeCampaignDirectoryCacheV1";function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function urlFor(x){return x.slug?base+encodeURIComponent(x.slug):base+"?c="+encodeURIComponent(x.uid)}function rowsFrom(items){return Object.keys(items||{}).map(k=>items[k]).filter(x=>x&&x.uid&&x.title).sort((a,b)=>String(a.title).localeCompare(String(b.title)))}function render(items){const rows=rowsFrom(items);if(!rows.length){list.innerHTML='<div class="empty">No campaigns are listed yet.</div>';return}list.innerHTML=rows.map(x=>{const by=String(x.campaignBy||x.by||"").trim();return '<a class="item" href="'+esc(urlFor(x))+'"><span class="itemTitle">'+esc(x.title)+'</span>'+(by?'<span class="itemBy">by '+esc(by)+'</span>':'')+'</a>'}).join("")}function hideLoader(){if(!loader)return;loader.classList.add("hide");setTimeout(()=>loader.remove(),450)}let hadCache=false;try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(cached&&cached.items){render(cached.items);hadCache=true;requestAnimationFrame(()=>hideLoader())}}catch(_){}async function load(){try{const snap=await getDoc(doc(db,"publicCampaignDirectory","all"));const items=snap.exists()?(snap.data()?.items||{}):{};render(items);try{localStorage.setItem(CACHE_KEY,JSON.stringify({items,updatedAt:Date.now()}))}catch(_){}if(!hadCache)hideLoader()}catch(e){if(!hadCache){list.innerHTML='<div class="empty">Could not load campaigns.</div>';hideLoader()}}}load();setTimeout(()=>hideLoader(),5000);</script></body></html>
